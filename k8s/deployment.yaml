apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastdeploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastdeploy
  template:
    metadata:
      labels:
        app: fastdeploy
    spec:
      containers:
        - name: fastdeploy
          image: fastdeploy:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
            livenessProbe:
              httpGet:
                path: /
                port: 8000
              initialDelaySeconds: 10
              periodSeconds: 10

            readinessProbe:
              httpGet:
                path: /
                port: 8000
              initialDelaySeconds: 5
              periodSeconds: 5

